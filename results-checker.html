<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results Checkers - Newton's Digital Hub</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}
header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:20px;
}
.container{
    max-width:500px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
select,input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}
.total{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    color:#0d6efd;
    text-align:center;
}
button{
    width:100%;
    margin-top:20px;
    padding:15px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<header>
<h2>Buy Results Checkers</h2>
</header>

<div class="container">

<label>Checker Type</label>
<select id="checker">
    <option>WASSCE Results Checker</option>
    <option>BECE Results Checker</option>
</select>

<label>Quantity</label>
<input type="number" id="qty" value="1" min="1">

<div class="total" id="total">
Total: GH₵23.00
</div>

<button>Proceed to Payment</button>

</div>

<script>
const pricePerChecker = 23;

function updateTotal() {
    const qty = document.getElementById("qty").value;
    document.getElementById("total").innerHTML =
        "Total: GH₵" + (qty * pricePerChecker).toFixed(2);
}

document.getElementById("qty").addEventListener("input", updateTotal);

updateTotal();
</script>

</body>
</html>
