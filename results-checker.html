<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results Checker - Newton's Digital Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:500px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:20px;
color:#0d6efd;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
select{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

.summary{
margin-top:20px;
padding:15px;
background:#eef4ff;
border-radius:8px;
}

.summary h3{
margin-bottom:10px;
}

.summary p{
margin:6px 0;
font-size:17px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0b5ed7;
}

#message{
margin-top:20px;
text-align:center;
font-weight:bold;
color:green;
}

</style>

</head>

<body>

<header>

<h1>Newton's Digital Hub</h1>

<p>Buy WASSCE & BECE Results Checkers</p>

</header>

<div class="container">

<h2>Results Checker</h2>

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email">

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="Enter phone number">

<label>Checker Type</label>

<select id="checker">

<option>WASSCE Results Checker</option>

<option>BECE Results Checker</option>

</select>

<label>Quantity</label>

<input
type="number"
id="qty"
value="1"
min="1">

<div class="summary">

<h3>Order Summary</h3>

<p id="summaryChecker"></p>

<p id="summaryQty"></p>

<p id="summaryPrice"></p>

</div>

<button id="payBtn">

Proceed to Payment

</button>

<div id="message"></div>

</div><script>

const checkerPrice = 23;

const checker = document.getElementById("checker");
const qty = document.getElementById("qty");

const summaryChecker = document.getElementById("summaryChecker");
const summaryQty = document.getElementById("summaryQty");
const summaryPrice = document.getElementById("summaryPrice");

function updateSummary(){

    let quantity = Number(qty.value);

    let total = quantity * checkerPrice;

    summaryChecker.innerHTML =
    "Checker: " + checker.value;

    summaryQty.innerHTML =
    "Quantity: " + quantity;

    summaryPrice.innerHTML =
    "Amount: GH₵" + total.toFixed(2);

}

checker.addEventListener("change", updateSummary);

qty.addEventListener("input", updateSummary);

updateSummary();

</script><script src="https://js.paystack.co/v1/inline.js"></script>

<script>

const payBtn = document.getElementById("payBtn");

payBtn.addEventListener("click", function(){

    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if(email === "" || phone === ""){
        document.getElementById("message").innerHTML =
        "Please enter your email and phone number.";
        return;
    }

    const amount = Number(qty.value) * checkerPrice * 100;

    let handler = PaystackPop.setup({

        key: "pk_live_d4e57ba3229fb8d228ddbb1192f8026b8b9a1fb2",

        email: email,

        amount: amount,

        currency: "GHS",

        metadata: {
            custom_fields: [
                {
                    display_name: "Phone Number",
                    variable_name: "phone",
                    value: phone
                },
                {
                    display_name: "Checker Type",
                    variable_name: "checker_type",
                    value: checker.value
                },
                {
                    display_name: "Quantity",
                    variable_name: "quantity",
                    value: qty.value
                }
            ]
        },

        callback: function(response){

    window.location.href =
    "success.html?reference=" + response.reference;

},

        onClose: function(){

            document.getElementById("message").innerHTML =
            "Payment cancelled.";

        }

    });

    handler.openIframe();

});

</script>
<a href="https://wa.me/233556248318" class="whatsapp" target="_blank">
💬
</a>

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#25D366;
color:white;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
text-decoration:none;
box-shadow:0 5px 15px rgba(0,0,0,.3);
z-index:999;
}

.whatsapp:hover{
transform:scale(1.1);
}
</style>
</body>
</html>
