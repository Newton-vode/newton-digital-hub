<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store - Newton's Digital Hub</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:900px;
    margin:40px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    padding:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:30px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card h2{
    color:#0d6efd;
}

.card p{
    margin:15px 0;
}

.btn{
    display:inline-block;
    background:#0d6efd;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:8px;
    font-weight:bold;
}
</style>
</head>
<body>

<header>
<h1>Newton's Digital Hub Store</h1>
<p>Select a service below</p>
</header>

<div class="container">

<div class="card">
<h2>📶 Buy Data Bundles</h2>
<p>Purchase MTN, Telecel and AirtelTigo bundles.</p>
<a href="buy-data.html" class="btn">Buy Data</a>
</div>

<div class="card">
<h2>📚 Results Checkers</h2>
<p>Buy WASSCE and BECE Results Checkers.</p>
<a href="results-checker.html" class="btn">Buy Checker</a>
</div>

</div>

</body>
</html>
