<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

.container{
max-width:500px;
margin:40px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
text-align:center;
color:#0d6efd;
}

.row{
margin:15px 0;
font-size:18px;
}

button{
width:100%;
padding:15px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h2>Order Summary</h2>

<div class="row">
<b>Network:</b> MTN
</div>

<div class="row">
<b>Bundle:</b> 5 GB
</div>

<div class="row">
<b>Phone:</b> 0551234567
</div>

<div class="row">
<b>Total:</b> GH₵30
</div>

<button id="payBtn">Pay Now</button>
</div>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
document.getElementById("payBtn").addEventListener("click", function(){
  let handler = PaystackPop.setup({
    key: 'pk_live_d4e57ba3229fb8d228ddbb1192f8026b8b9a1fb2',
    email: 'customer@email.com',
    amount: 3000,
    currency: 'GHS',

    callback: function(response){
      alert("Payment successful. Reference: " + response.reference);
      window.location.href = "index.html";
    },

    onClose: function(){
      alert("Payment cancelled");
    }
  });

  handler.openIframe();
});
</script>
</body>
</html>
